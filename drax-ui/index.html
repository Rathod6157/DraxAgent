<!doctype html>
<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#17181C"
    />

    <title>Drax — Desktop AI Companion</title>

    <script
      type="module"
      src="/src/main.ts"
      defer
    ></script>

  </head>


  <body>

    <div id="app" class="product-shell">

      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="sidebar-top">
          <div class="sidebar-brand">
            <div class="sidebar-logo"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23263f68'/%3E%3Cpath d='M32 10 39 25 54 32 39 39 32 54 25 39 10 32 25 25Z' fill='none' stroke='%239fc4ff' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%239fc4ff'/%3E%3C/svg%3E" alt="" /></div>
            <div class="sidebar-brand-copy"><strong>Drax</strong><span>Desktop AI companion</span></div>
            <button class="sidebar-collapse-button" id="sidebar-collapse-button" type="button"
              aria-label="Collapse sidebar" aria-pressed="false" title="Collapse sidebar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2.5"></rect><path d="M9 4v16M14 9l-3 3 3 3"></path></svg>
            </button>
            <span class="sidebar-presence" title="Drax is running"></span>
          </div>
          <button class="nav-item nav-primary" id="new-chat-button" type="button"><span class="nav-icon">＋</span><span>New conversation</span><kbd>Ctrl K</kbd></button>
          <div class="sidebar-section-label">WORKSPACE</div>
          <button class="nav-item is-active" data-view="chat" type="button"><span class="nav-icon"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="14.5" rx="3"></rect><path d="m8 19-3.5 2v-4"></path></svg></span><span>Chat</span></button>
          <button class="nav-item" data-view="projects" type="button"><span class="nav-icon"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h6l2 2h9v9.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path><path d="M3.5 7.5v-1a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v1"></path></svg></span><span>Projects</span></button>
          <button class="nav-item" data-view="library" type="button"><span class="nav-icon"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5v15M10 4.5v15M15 4.5l4 15"></path></svg></span><span>Library</span></button>
          <button class="nav-item" data-view="activity" type="button"><span class="nav-icon"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.2-6 4.1 12 2.2-6H21"></path></svg></span><span>Activity</span></button>
          <div class="sidebar-section-heading"><span>RECENT</span><button id="clear-history-button" type="button" title="Clear local conversation list">•••</button></div>
          <div class="conversation-list" id="conversation-list" aria-label="Recent conversations"></div>
        </div>
        <div class="sidebar-bottom">
          <button class="nav-item" data-view="settings" type="button"><span class="nav-icon"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.55 2.8h4.9l.55 2.05c.58.2 1.12.51 1.6.92l2.08-.5 2.45 4.24-1.53 1.5a6.6 6.6 0 0 1 0 1.98l1.53 1.5-2.45 4.24-2.08-.5c-.48.41-1.02.72-1.6.92l-.55 2.05h-4.9L9 19.15a6.8 6.8 0 0 1-1.6-.92l-2.08.5-2.45-4.24 1.53-1.5a6.6 6.6 0 0 1 0-1.98l-1.53-1.5 2.45-4.24 2.08.5c.48-.41 1.02-.72 1.6-.92z"></path><circle cx="12" cy="12" r="3.15"></circle></svg></span><span>Settings</span></button>
          <div class="sidebar-profile"><div class="profile-avatar">D</div><div><strong>Drax</strong><span>Local desktop agent</span></div><span class="profile-menu">···</span></div>
        </div>
      </aside>

      <div class="workspace" id="workspace">
      <header class="mobile-topbar"><button id="sidebar-toggle" type="button" aria-label="Toggle navigation">☰</button><strong>Drax</strong><span class="mobile-online"><i></i> Online</span></header>
      <section class="view-panel" id="section-view" hidden aria-live="polite"></section>
      <div id="chat-view" class="chat-view">

      <!-- =====================================================
           HEADER
           ===================================================== -->

      <header class="app-header">

        <div class="brand">

          <div class="brand-logo">

            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23263f68'/%3E%3Cpath d='M32 10 39 25 54 32 39 39 32 54 25 39 10 32 25 25Z' fill='none' stroke='%239fc4ff' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%239fc4ff'/%3E%3C/svg%3E"
              alt="Drax"
            />

          </div>


          <div class="brand-copy">

            <div class="brand-name">
              Drax
            </div>

            <div class="brand-subtitle">
              Your desktop AI companion
            </div>

          </div>

        </div>


        <div class="presence">

          <span class="presence-dot"></span>

          <span class="presence-label">
            Online
          </span>

        </div>

      </header>


      <!-- =====================================================
           MAIN
           ===================================================== -->

      <main class="app-main">


        <!-- ===================================================
             ACTIVITY
             =================================================== -->

        <section class="activity-card">

          <div class="activity-top">

            <div class="activity-heading">

              <span class="activity-pulse"></span>

              <span>CURRENTLY</span>

            </div>


            <span class="activity-live">
              LIVE
            </span>

          </div>


          <div class="activity-content">

            <div class="activity-icon" aria-hidden="true">
              <span class="activity-icon-core">
                <svg viewBox="0 0 24 24">
                  <path d="M12 3.5 20.5 12 12 20.5 3.5 12 12 3.5Z"></path>
                  <path d="M8.5 12h7"></path>
                  <path d="M12 8.5v7"></path>
                </svg>
              </span>
              <span class="activity-icon-ring"></span>
            </div>


            <div class="activity-details">

              <div class="activity-title-row">

                <div
                  class="activity-title"
                  id="activity-title"
                >
                  Ready
                </div>

                <span
                  class="activity-state"
                  id="activity-state"
                >
                  LIVE
                </span>

              </div>


              <div
                class="activity-application"
                id="activity-application"
              >
                Waiting for desktop activity
              </div>


              <div
                class="activity-window"
                id="activity-window"
              >
                Desktop
              </div>

            </div>



          </div>

        </section>


        <!-- ===================================================
             CHAT
             =================================================== -->

        <section
          class="chat-shell"
          aria-label="Drax conversation"
        >

          <div
            class="conversation"
            id="conversation"
          >


            <!-- =================================================
                 WELCOME MESSAGE
                 ================================================= -->

            <article class="message-row drax-row">

              <div class="message drax-message welcome-message">

                <div class="message-header">

                  <div class="message-avatar">

                    <img
                      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23263f68'/%3E%3Cpath d='M32 10 39 25 54 32 39 39 32 54 25 39 10 32 25 25Z' fill='none' stroke='%239fc4ff' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%239fc4ff'/%3E%3C/svg%3E"
                      alt=""
                    />

                  </div>


                  <span class="message-sender">Drax</span>

                  <span class="message-time">Now</span>

                </div>


                <div class="message-text">Hey! I'm Drax. What can I do for you?</div>


                <div class="suggestions">

                  <button
                    class="suggestion"
                    data-command="Open Chrome"
                  >
                    Open Chrome
                  </button>


                  <button
                    class="suggestion"
                    data-command="What can you do?"
                  >
                    What can you do?
                  </button>


                  <button
                    class="suggestion"
                    data-command="Show my activity"
                  >
                    Show my activity
                  </button>

                </div>

              </div>

            </article>

          </div>

        </section>


        <!-- ===================================================
             INPUT
             =================================================== -->

        <section class="input-area">

          <form
            class="composer"
            id="command-form"
          >

            <input
              id="command-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="Ask Drax anything..."
              aria-label="Message Drax"
            />


            <button
              class="send-button"
              type="submit"
              aria-label="Send message"
            >

              <span>➤</span>

            </button>

          </form>


          <div class="input-hint">
            Press Enter to send
          </div>

        </section>

      </main>

      </div><!-- /chat-view -->

      <!-- =====================================================
           STATUS TOAST
           ===================================================== -->

      <div
        class="status-toast"
        id="status-toast"
        aria-live="polite"
      >

        <span
          class="status-toast-icon"
          id="status-icon"
          aria-hidden="true"
        ></span>

        <span class="status-toast-dot"></span>

        <span id="status-text">
          Ready
        </span>

      </div>

      </div><!-- /workspace -->
      <div class="sidebar-scrim" id="sidebar-scrim"></div>
    </div>

  </body>

</html>
